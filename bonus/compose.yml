services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: ${ZAPPY_PORT:-4242}
      WIDTH: ${ZAPPY_WIDTH:-10}
      HEIGHT: ${ZAPPY_HEIGHT:-10}
      TEAMS: ${ZAPPY_TEAMS:-REDS BLUES}
      CLIENTS: ${ZAPPY_CLIENTS:-3}
      FREQ: ${ZAPPY_FREQ:-100}
      # empty value = classic mode (no serial turns) — best for playbook scenes
      WAIT_TIMEOUT: ${ZAPPY_WAIT_TIMEOUT-2000}
    expose:
      - "${ZAPPY_PORT:-4242}"
    networks:
      - zappy-net

  zaplauncher:
    build:
      context: ./ZapLauncher
      dockerfile: Dockerfile
    environment:
      API_KEY: ${API_KEY:-}
      ZAPPY_SERVER_HOST: ${ZAPPY_SERVER_HOST:-server}
      ZAPPY_SERVER_PORT: ${ZAPPY_PORT:-4242}
      ZAPPY_CLIENTS: ${ZAPPY_CLIENTS:-3}
    ports:
      - "${ZAPLAUNCHER_PORT:-8000}:8000"
    depends_on:
      - server
    networks:
      - zappy-net
    volumes:
      - ./ZapLauncher/prompt_database:/prompt_database

  gui:
    build:
      context: ./GUI
      dockerfile: Dockerfile
    environment:
      ZAPPY_SERVER_HOST: ${ZAPPY_SERVER_HOST:-server}
      ZAPPY_SERVER_PORT: ${ZAPPY_PORT:-4242}
      GUI_PORT: ${GUI_PORT:-8081}
      TILE_UPDATE_INTERVAL_MS: ${TILE_UPDATE_INTERVAL_MS:-5000}
    ports:
      - "${GUI_PORT:-8081}:8081"
    depends_on:
      - server
    networks:
      - zappy-net

networks:
  zappy-net:
    driver: bridge
